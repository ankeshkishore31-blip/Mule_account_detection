<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mule Sentinel — Fraud Investigator Workspace</title>
    <!-- Blocking theme resolution to prevent FOUC / theme flash -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mule_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme ? savedTheme : (systemDark ? 'night' : 'daylight');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'daylight');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] antialiased overflow-hidden select-none">
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
